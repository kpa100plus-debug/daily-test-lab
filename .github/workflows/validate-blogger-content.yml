name: Validate Blogger content

on:
  pull_request:
    paths:
      - "automation/blogger/**"
      - ".github/workflows/validate-blogger-content.yml"
  push:
    branches:
      - main
    paths:
      - "automation/blogger/**"
      - ".github/workflows/validate-blogger-content.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Blogger content manifest
        run: node automation/blogger/validate-content.mjs
      - name: Test Blogger synchronization logic
        run: node automation/blogger/test-sync.mjs
