name: Validate Blogger content

on:
  pull_request:
    paths:
      - "automation/blogger/**"
      - ".github/workflows/validate-blogger-content.yml"
  push:
    branches:
      - main
    paths:
      - "automation/blogger/**"
      - ".github/workflows/validate-blogger-content.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate Blogger content manifest
        run: node automation/blogger/validate-content.mjs
      - name: Test Blogger synchronization logic
        run: node automation/blogger/test-sync.mjs
