name: Cloudflare read-only asset audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit Pages, Workers, zones, and DNS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_READONLY_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Required Actions secrets are missing: CLOUDFLARE_READONLY_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Read-only Cloudflare inventory audit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const apiToken = process.env.CF_API_TOKEN;
          const accountId = process.env.CF_ACCOUNT_ID;
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const candidatePattern = /(fortune|tarot|운세|타로)/iu;

          async function cf(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              headers: {
                Authorization: `Bearer ${apiToken}`,
                'Content-Type': 'application/json'
              }
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success === false) {
              const errors = Array.isArray(payload.errors)
                ? payload.errors.map((entry) => entry.message || entry.code).join('; ')
                : `HTTP ${response.status}`;
              throw new Error(`${path}: ${errors}`);
            }
            return payload;
          }

          async function paged(path, perPage = 100) {
            const collected = [];
            for (let page = 1; page <= 100; page += 1) {
              const separator = path.includes('?') ? '&' : '?';
              const payload = await cf(`${path}${separator}page=${page}&per_page=${perPage}`);
              const batch = Array.isArray(payload.result) ? payload.result : [];
              collected.push(...batch);
              const totalPages = Number(payload.result_info?.total_pages || 1);
              if (page >= totalPages || batch.length === 0) break;
            }
            return collected;
          }

          function pageText(project) {
            return [
              project.name,
              project.subdomain,
              ...(Array.isArray(project.domains) ? project.domains : [])
            ].filter(Boolean).join(' ');
          }

          function workerText(worker) {
            return [worker.id, worker.name, worker.etag].filter(Boolean).join(' ');
          }

          function zoneText(zone) {
            return [zone.name, zone.status].filter(Boolean).join(' ');
          }

          function dnsText(record) {
            return [record.name, record.content, record.type].filter(Boolean).join(' ');
          }

          function safe(value) {
            return String(value ?? '').replace(/[|\r\n]+/g, ' ').trim();
          }

          function appendSection(lines, title, entries, render) {
            lines.push(`## ${title}`, '');
            if (entries.length === 0) {
              lines.push('- 일치 후보 없음', '');
              return;
            }
            lines.push('| 구분 | 이름 | 주소·대상 | 상태 |', '|---|---|---|---|');
            for (const entry of entries) {
              const row = render(entry);
              lines.push(`| ${safe(row.kind)} | ${safe(row.name)} | ${safe(row.target)} | ${safe(row.status)} |`);
            }
            lines.push('');
          }

          async function main() {
            const pages = await paged(`/accounts/${accountId}/pages/projects`);
            const workers = await paged(`/accounts/${accountId}/workers/scripts`);
            const zones = await paged(`/zones?account.id=${encodeURIComponent(accountId)}`, 50);

            const dnsRecords = [];
            for (const zone of zones) {
              const records = await paged(`/zones/${zone.id}/dns_records`);
              for (const record of records) {
                dnsRecords.push({ ...record, zoneName: zone.name });
              }
            }

            const pageMatches = pages.filter((entry) => candidatePattern.test(pageText(entry)));
            const workerMatches = workers.filter((entry) => candidatePattern.test(workerText(entry)));
            const zoneMatches = zones.filter((entry) => candidatePattern.test(zoneText(entry)));
            const dnsMatches = dnsRecords.filter((entry) => candidatePattern.test(dnsText(entry)));

            const lines = [
              '# Cloudflare 읽기 전용 자산 감사',
              '',
              '- 참조코드: `REF-ISEA-CODEX-CHATGPTWEB-HANDOFF-20260827-01`',
              '- 검색어: `오늘의 운세`, `오늘의 타로`, `fortune`, `tarot`',
              '- 실행 작업: 조회만 수행',
              '',
              '## 전체 항목 수',
              '',
              `- Pages 프로젝트: ${pages.length}`,
              `- Workers 스크립트: ${workers.length}`,
              `- DNS 영역(도메인): ${zones.length}`,
              `- DNS 레코드: ${dnsRecords.length}`,
              ''
            ];

            appendSection(lines, 'Pages 일치 후보', pageMatches, (entry) => ({
              kind: 'Pages',
              name: entry.name,
              target: entry.subdomain || (entry.domains || []).join(', '),
              status: entry.latest_deployment?.stage?.name || '확인됨'
            }));

            appendSection(lines, 'Workers 일치 후보', workerMatches, (entry) => ({
              kind: 'Worker',
              name: entry.id || entry.name,
              target: '',
              status: entry.modified_on || entry.created_on || '확인됨'
            }));

            appendSection(lines, '도메인 일치 후보', zoneMatches, (entry) => ({
              kind: 'Zone',
              name: entry.name,
              target: '',
              status: entry.status
            }));

            appendSection(lines, 'DNS 일치 후보', dnsMatches, (entry) => ({
              kind: entry.type,
              name: entry.name,
              target: entry.content,
              status: entry.zoneName
            }));

            fs.appendFileSync(summaryPath, lines.join('\n') + '\n', 'utf8');
            console.log(`Audit complete. Pages=${pages.length}, Workers=${workers.length}, Zones=${zones.length}, DNS=${dnsRecords.length}`);
            console.log(`Candidate matches. Pages=${pageMatches.length}, Workers=${workerMatches.length}, Zones=${zoneMatches.length}, DNS=${dnsMatches.length}`);
          }

          main().catch((error) => {
            console.error('::error::Cloudflare read-only audit failed:', error.message);
            process.exitCode = 1;
          });
          NODE
