name: Firestore emergency rules

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Ruleset to deploy
        required: true
        type: choice
        options:
          - lockdown
          - normal

permissions:
  contents: read
  id-token: write

jobs:
  deploy-rules:
    if: ${{ vars.FIREBASE_SECURITY_AUTOMATION_ENABLED == 'true' }}
    environment: firebase-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked dependencies
        run: npm ci

      - name: Authenticate without a stored service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RULES_SERVICE_ACCOUNT }}
          project_id: daily-test-lab

      - name: Verify both rulesets before deployment
        run: npm run test:rules

      - name: Deploy selected ruleset
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "lockdown" ]]; then
            npx firebase-tools deploy --only firestore:rules --project daily-test-lab --config firebase.lockdown.json --non-interactive
          elif [[ "$MODE" == "normal" ]]; then
            npx firebase-tools deploy --only firestore:rules --project daily-test-lab --config firebase.json --non-interactive
          else
            exit 2
          fi
