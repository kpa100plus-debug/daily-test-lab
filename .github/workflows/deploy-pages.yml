name: Deploy DAILY TEST LAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      PUBLIC_SITE_URL: https://kpa100plus-debug.github.io/daily-test-lab
      SITE_BASE_PATH: /daily-test-lab
      ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
      ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
      ADSENSE_CONTENT_SLOT_ID: ${{ vars.ADSENSE_CONTENT_SLOT_ID }}
      ADSENSE_RESULT_SLOT_ID: ${{ vars.ADSENSE_RESULT_SLOT_ID }}
      ADSENSE_FOOTER_SLOT_ID: ${{ vars.ADSENSE_FOOTER_SLOT_ID }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: node scripts/build.mjs

      - name: Verify build
        run: node scripts/verify.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
