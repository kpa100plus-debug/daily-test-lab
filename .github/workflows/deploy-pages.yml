name: Deploy DAILY TEST LAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      PUBLIC_SITE_URL: https://dtlabkr.dpdns.org
      SITE_BASE_PATH: ''
      ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
      ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
      ADSENSE_CONTENT_SLOT_ID: ${{ vars.ADSENSE_CONTENT_SLOT_ID }}
      ADSENSE_RESULT_SLOT_ID: ${{ vars.ADSENSE_RESULT_SLOT_ID }}
      ADSENSE_FOOTER_SLOT_ID: ${{ vars.ADSENSE_FOOTER_SLOT_ID }}
      FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.FIREBASE_APP_CHECK_SITE_KEY || '6LfRh5YtAAAAAP6TcW_mwy4ekJQXM4q7mRGWL3Iu' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build static site
        run: node scripts/build.mjs

      - name: Verify build
        run: node scripts/verify.mjs

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
